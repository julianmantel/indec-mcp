name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, test y publicar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Node.js y registro npm
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Tests
        run: npm test

      - name: Publicar en npm con OIDC (sin token)
        run: npm publish
